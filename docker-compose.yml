version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: tradeflow-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: tradeflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: tradeflow-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  ai-engine:
    build:
      context: ./ai-engine
    container_name: tradeflow-ai-engine
    ports:
      - "8000:8000"
    environment:
      AI_API_KEY: tradeflow-default-key

volumes:
  postgres_data:
  redis_data:
